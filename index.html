<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="color-scheme" content="light" />
<link rel="icon" href="data:," />
<title>Taco Bar Signup</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;0,800;1,500&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700;9..40,800&display=swap" rel="stylesheet" />
<style>
  :root{
    --bg:#ffffff;
    --surface:#ffffff;
    --surface-2:#f7f5ee;
    --ink:#26301f;
    --ink-soft:#6d7261;
    --line:#e7e0cd;
    --evergreen:#2f5d3a;
    --evergreen-deep:#1e4028;
    --evergreen-soft:#edf3e8;
    --gold:#a8842f;
    --gold-deep:#8a6a22;
    --gold-soft:#faf2dc;
    --berry:#a62b25;
    --danger:#b3261e;
    --shadow:0 10px 28px rgba(46,64,32,.10);
    --radius:18px;
  }
  *{box-sizing:border-box}
  body{
    margin:0;color:var(--ink);
    font-family:"DM Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
    font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;
    background:
      radial-gradient(circle at 12% 18%, rgba(168,132,47,.07) 0 2px, transparent 3px),
      radial-gradient(circle at 84% 12%, rgba(47,93,58,.07) 0 2px, transparent 3px),
      radial-gradient(circle at 70% 82%, rgba(168,132,47,.06) 0 2px, transparent 3px),
      radial-gradient(circle at 24% 88%, rgba(47,93,58,.06) 0 2px, transparent 3px),
      #fbfaf6;
    min-height:100dvh;
  }
  button,input,textarea{font:inherit;color:inherit}
  button,[role="button"]{min-height:44px}
  h1,h2,h3{font-family:"Playfair Display",Georgia,serif;line-height:1.12;margin:0}

  /* ---------- Phone frame — only the phone ---------- */
  .stage{min-height:100dvh;display:grid;place-items:center;padding:0}
  .phone{
    position:relative;width:100%;height:100dvh;background:var(--bg);
    display:flex;flex-direction:column;overflow:hidden;
  }
  @media (min-width:520px){
    .stage{padding:26px 12px}
    .phone{
      width:390px;height:auto;aspect-ratio:9/19.2;max-height:94dvh;
      border-radius:52px;border:3px solid #141a15;
      box-shadow:0 0 0 9px #232b24, 0 0 0 11px #9aa39a, 0 34px 80px rgba(20,35,22,.35);
    }
  }
  .island{
    display:none;position:absolute;top:11px;left:50%;transform:translateX(-50%);
    width:104px;height:27px;border-radius:99px;background:#0c0f0c;z-index:30;
  }
  @media (min-width:520px){ .island{display:block} }
  .screen{
    flex:1;overflow-y:auto;overflow-x:hidden;position:relative;background:#fff;
    scrollbar-width:thin;
  }
  @media (min-width:520px){ .screen{border-radius:49px} }

  /* ---------- Cart button, top right ---------- */
  .cart-btn{
    position:absolute;top:14px;right:14px;z-index:60;
    width:50px;height:50px;min-height:50px;border-radius:50%;
    background:#fff;border:1.5px solid var(--line);
    box-shadow:0 6px 18px rgba(20,35,22,.22);
    display:grid;place-items:center;cursor:pointer;
    transition:width .2s ease, height .2s ease, min-height .2s ease, top .2s ease, right .2s ease, box-shadow .2s ease;
  }
  .cart-btn svg{width:24px;height:24px;transition:width .2s ease, height .2s ease}
  /* Once you start scrolling, the cart shrinks down and tucks into the corner, still above everything */
  .cart-btn.shrunk{
    width:38px;height:38px;min-height:38px;top:10px;right:10px;
    box-shadow:0 4px 12px rgba(20,35,22,.18);
  }
  .cart-btn.shrunk svg{width:18px;height:18px}
  .cart-btn.shrunk .cart-badge{min-width:18px;height:18px;font-size:.64rem;top:-3px;right:-3px}
  @media (prefers-reduced-motion: reduce){ .cart-btn,.cart-btn svg{transition:none} }
  .cart-btn:focus-visible{outline:3px solid var(--evergreen);outline-offset:2px}
  .cart-badge{
    position:absolute;top:-4px;right:-4px;min-width:22px;height:22px;padding:0 5px;
    border-radius:99px;background:var(--berry);color:#fff;
    font-size:.74rem;font-weight:800;display:grid;place-items:center;
    border:2px solid #fff;
  }
  .cart-badge[hidden]{display:none}

  /* ---------- Hero image only ---------- */
  .hero-img{width:100%;height:218px;object-fit:cover;object-position:center;display:block}

  /* ---------- Flow ---------- */
  .flow{padding:18px 18px 34px}

  /* Topic buttons — all six on ONE line. Shading tells the story:
     not seen yet = white; seen (visited) = light green (--evergreen-soft,
     same as a selected item card); has picks = dark green with white text.
     The red notification badge shows the pick count on top of that.
     Current keeps whatever fill its state gives it, plus a bold dark-green border. */
  .topic-nav{display:flex;flex-wrap:nowrap;gap:4px;position:sticky;top:50px;z-index:20;background:#fff;padding:8px 0;margin:-6px 0 0}
  /* While stuck, fill the band above the bar (behind/around the cutout and cart) with white
     so scrolled content doesn't slide through it, and the line items stay cleanly underneath the cart */
  .topic-nav.is-stuck{box-shadow:0 -50px 0 18px #fff}
  .topic-btn{
    flex:1 1 0;min-width:0;position:relative;
    border:1.5px solid var(--line);background:#fff;border-radius:9px;cursor:pointer;
    padding:6px 1px;min-height:36px;
    font-size:.69rem;font-weight:700;letter-spacing:-.02em;color:var(--ink-soft);
    display:inline-flex;align-items:center;justify-content:center;text-align:center;
    white-space:nowrap;overflow:visible;
    transition:background .15s ease, border-color .15s ease, color .15s ease, transform .1s ease;
  }
  .topic-label{
    white-space:nowrap;pointer-events:none;line-height:1;
  }
  .topic-btn:hover{border-color:var(--evergreen)}
  .topic-btn:active{transform:scale(.94)}
  .topic-btn:focus-visible{outline:3px solid var(--evergreen);outline-offset:2px}
  /* Pick count as a notification badge overlapping the top-right corner */
  .topic-btn .cnt{
    position:absolute;top:-6px;right:-3px;z-index:2;pointer-events:none;
    min-width:17px;height:17px;padding:0 3px;
    background:var(--berry);color:#fff;border:2px solid #fff;border-radius:99px;
    font-size:.6rem;font-weight:800;line-height:1;display:grid;place-items:center;
    box-shadow:0 2px 6px rgba(20,35,22,.25);
  }
  .topic-btn .cnt[hidden]{display:none}
  /* Seen this topic already (but nothing picked in it) = light green */
  .topic-btn.is-visited{background:var(--evergreen-soft);border-color:var(--evergreen);color:var(--evergreen-deep)}
  /* Picked something in this topic = dark green fill */
  .topic-btn.has-picks{background:var(--evergreen);border-color:var(--evergreen);color:#fff}
  .topic-btn.has-picks:hover{border-color:var(--evergreen-deep)}
  /* Current topic = bold border */
  .topic-btn.is-current{
    border:2px solid var(--evergreen);color:var(--evergreen-deep);font-weight:800;
    box-shadow:0 2px 6px rgba(47,93,58,.15);
  }
  .topic-btn.has-picks.is-current{border-color:var(--evergreen-deep);color:#fff}
  .optional-note{
    margin:4px 0 0;color:var(--ink-soft);
    font-size:.84rem;font-weight:500;line-height:1.3;text-align:center;white-space:nowrap;
  }
  /* When the nav is stuck, add a subtle bottom shadow so items visually slide under it */
  .topic-nav.is-stuck::after{
    content:'';position:absolute;left:0;right:0;bottom:-6px;height:6px;
    background:linear-gradient(180deg,rgba(0,0,0,.06),transparent);pointer-events:none;
  }

  /* Split up — only one step shows at a time, only the choice in front of you */
  .step{display:none;padding:10px 0 6px}
  .step.active{display:block;animation:in .22s ease}
  .step.checkout-step{background:linear-gradient(180deg,var(--gold-soft),#fff 130px);border:2px solid var(--gold);border-radius:16px;padding:16px 14px}
  @keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  @media (prefers-reduced-motion: reduce){ .topic-btn{transition:none} .step.active{animation:none} }
  .step h2{font-size:1.55rem;font-weight:700;color:var(--evergreen-deep);margin-top:6px}
  .step .sub{color:var(--ink-soft);margin:6px 0 2px;font-size:.94rem}

  .items{display:grid;grid-template-columns:1fr;gap:12px;margin-top:14px}

  /* Every food — pick how much you'll bring, same style as checkout */
  .p-item{
    background:linear-gradient(180deg,var(--gold-soft),#fff 70px);
    border:2px solid var(--gold);
    border-radius:16px;
    padding:16px 14px;
    transition:border-color .15s ease, background .15s ease, box-shadow .15s ease;
  }
  .p-item.on{
    border-color:var(--evergreen);
    background:linear-gradient(180deg,var(--evergreen-soft),#fff 70px);
    box-shadow:0 4px 16px rgba(47,93,58,.12);
    animation:pop .25s ease;
  }
  @keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.015)}100%{transform:scale(1)}}
  .p-item .p-head{display:flex;justify-content:space-between;align-items:center;gap:10px}
  .p-item b{font-size:1.08rem;color:var(--evergreen-deep)}
  .cooked{font-size:.74rem;font-weight:800;letter-spacing:.04em;text-transform:uppercase;color:var(--gold-deep);background:var(--gold-soft);border-radius:999px;padding:4px 9px;white-space:nowrap}
  .lb-row{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}
  .lb{
    border:2px solid var(--line);background:#fff;border-radius:999px;cursor:pointer;
    padding:7px 12px;min-width:48px;min-height:44px;font-weight:800;font-size:.95rem;text-align:center;
    transition:transform .1s ease, border-color .15s ease, background .15s ease, color .15s ease;
  }
  .lb:hover{border-color:var(--evergreen)}
  .lb:active{transform:scale(.93)}
  .lb:focus-visible{outline:3px solid var(--evergreen);outline-offset:2px}
  .lb[aria-pressed="true"]{background:var(--evergreen);border-color:var(--evergreen);color:#fff}

  .step-foot{display:flex;gap:10px;margin-top:22px;flex-wrap:wrap;align-items:center}
  .btn{
    border-radius:13px;padding:12px 20px;font-weight:700;cursor:pointer;border:2px solid transparent;
    min-height:48px;font-size:1rem;
  }
  .btn-primary{background:var(--evergreen);color:#fff;flex:1;transition:background .15s ease, transform .1s ease}
  .btn-primary:hover{background:var(--evergreen-deep)}
  .btn-primary:active{transform:scale(.97)}
  .btn-ghost{background:transparent;border-color:var(--line);color:var(--ink)}
  .btn-ghost:hover{border-color:var(--evergreen)}
  .btn-ghost:disabled{opacity:.38;cursor:default}
  .btn-ghost:disabled:hover{border-color:var(--line)}
  .btn-skip{background:var(--gold-soft);border-color:var(--gold);color:var(--gold-deep);width:100%;margin-top:10px}
  .btn-skip:hover{border-color:var(--gold-deep)}
  /* ---------- Review ---------- */
  label.field{display:block;font-weight:700;margin-bottom:6px}
  .field-wrap{margin-bottom:16px}
  input[type="text"],input[type="email"],textarea{
    width:100%;border:2px solid var(--line);border-radius:12px;background:var(--surface);
    padding:12px 14px;min-height:48px;
  }
  input[type="text"]:focus,input[type="email"]:focus,textarea:focus{outline:none;border-color:var(--evergreen)}
  input.invalid{border-color:var(--danger)}
  .error{display:none;color:var(--danger);font-size:.88rem;font-weight:600;margin-top:6px}
  .error.show{display:block}
  .review-group{margin-bottom:16px}
  .review-group h3{font-family:"DM Sans",sans-serif;font-size:.82rem;letter-spacing:.06em;text-transform:uppercase;color:var(--evergreen-deep);margin-bottom:8px}
  .review-list{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
  .chip{
    display:inline-flex;align-items:center;gap:8px;background:var(--evergreen-soft);color:var(--ink);
    border-radius:999px;padding:7px 8px 7px 14px;font-weight:600;font-size:.9rem;min-height:38px;
  }
  .chip .cq{color:var(--gold-deep);font-weight:700}
  .chip button{
    border:none;background:var(--surface);color:var(--danger);width:26px;height:26px;min-height:26px;
    border-radius:50%;cursor:pointer;font-weight:800;line-height:1;display:grid;place-items:center;font-size:.9rem;
  }
  .edit-link{
    background:none;border:none;color:var(--evergreen-deep);font-weight:700;cursor:pointer;
    text-decoration:underline;text-underline-offset:3px;padding:8px 4px;min-height:38px;
  }
  .empty-note{color:var(--ink-soft);font-style:italic}

  /* ---------- Cart sheet ---------- */
  .sheet-backdrop{
    position:absolute;inset:0;background:rgba(18,28,18,.45);z-index:50;
    opacity:0;pointer-events:none;transition:opacity .2s ease;
  }
  @media (min-width:520px){ .sheet-backdrop{border-radius:49px} }
  .sheet-backdrop.open{opacity:1;pointer-events:auto}
  .sheet{
    position:absolute;left:0;right:0;bottom:0;z-index:51;background:#fff;
    border-radius:24px 24px 0 0;box-shadow:0 -14px 40px rgba(16,29,19,.3);
    padding:10px 20px 24px;max-height:78%;overflow-y:auto;
    transform:translateY(105%);transition:transform .25s ease;
  }
  @media (min-width:520px){ .sheet{border-radius:24px 24px 49px 49px} }
  .sheet.open{transform:none}
  @media (prefers-reduced-motion: reduce){ .sheet,.sheet-backdrop{transition:none} }
  .sheet .grab{width:40px;height:5px;border-radius:99px;background:var(--line);margin:2px auto 12px}
  .sheet-head{display:flex;justify-content:space-between;align-items:center;gap:10px}
  .sheet-head h2{font-size:1.3rem;font-weight:700;color:var(--evergreen-deep)}
  .sheet-close{
    border:none;background:var(--surface-2);width:40px;height:40px;min-height:40px;border-radius:50%;
    cursor:pointer;font-size:1.05rem;font-weight:800;flex:0 0 auto;
  }
  .sheet .count-line{color:var(--ink-soft);font-size:.92rem;margin:4px 0 12px}
  .sheet-group{margin-bottom:12px}
  .sheet-group h3{font-family:"DM Sans",sans-serif;font-size:.76rem;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-soft);margin:0 0 6px}
  .sheet ul{list-style:none;margin:0;padding:0}
  .sheet li{
    display:flex;justify-content:space-between;align-items:center;gap:8px;
    padding:7px 0;border-bottom:1px dashed var(--line);font-size:.95rem;font-weight:500;
  }
  .sheet li:last-child{border-bottom:none}
  .sheet li .bq{display:block;font-size:.8rem;color:var(--gold-deep);font-weight:700}
  .sheet li button{
    border:none;background:transparent;color:var(--danger);cursor:pointer;font-weight:800;
    width:36px;height:36px;min-height:36px;border-radius:50%;font-size:1rem;flex:0 0 auto;
  }
  .sheet-empty{color:var(--ink-soft);font-size:.94rem;background:var(--surface-2);border-radius:12px;padding:14px}
  .sheet .go-review{width:100%;margin-top:10px;flex:none}
  .btn:disabled{opacity:.45;cursor:not-allowed}

  /* ---------- Done ---------- */
  .done{display:none;text-align:center;padding:26px 4px 10px}
  .done.show{display:block;animation:in .25s ease}
  .done .badge{
    width:74px;height:74px;border-radius:50%;background:var(--evergreen-soft);color:var(--evergreen);
    display:grid;place-items:center;margin:6px auto 16px;font-size:2rem;font-weight:800;
  }
  .done h2{font-size:1.8rem;font-weight:800;color:var(--evergreen-deep)}
  .done p{color:var(--ink-soft);max-width:34ch;margin:10px auto 0}
  .done .mine{text-align:left;background:var(--surface-2);border-radius:14px;padding:16px 18px;margin:20px auto}
  .done .mine h3{font-family:"DM Sans",sans-serif;font-size:.8rem;letter-spacing:.06em;text-transform:uppercase;color:var(--evergreen-deep);margin:0 0 8px}
  .done .mine ul{margin:0;padding-left:20px}
  .done .mine li{padding:2px 0;font-weight:500}
  .done .mine li .dq{color:var(--gold-deep);font-weight:700;font-size:.88rem}
  .done .btn{flex:none;width:100%}
</style>
</head>

<div class="stage">
  <div class="phone">
    <div class="island" aria-hidden="true"></div>

    <button class="cart-btn" id="cart-btn" type="button" aria-label="View your picks">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#1e4028" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="21" r="1.6"/><circle cx="19" cy="21" r="1.6"/><path d="M2.5 3h2l2.6 12.4a2 2 0 0 0 2 1.6h8.7a2 2 0 0 0 2-1.6L21.5 7H6"/></svg>

    </button>

    currentStep = i;
    visited[i] = true;
    var secs = stepsEl.querySelectorAll('.step');
    for (var s = 0; s < secs.length; s++){
      secs[s].classList.toggle('active', s === currentStep);
    }
    updateNav();
    if (!skipScroll) screenEl.scrollTo({top: document.getElementById('flow-wrap').offsetTop - 8, behavior:'smooth'});
  }

  function updateNav(){
    var btns = navEl.querySelectorAll('.topic-btn');
    for (var i = 0; i < btns.length; i++){
      var cnt = btns[i].querySelector('.cnt');
      var n = 0;
      if (i < CATEGORIES.length){
        CATEGORIES[i].items.forEach(function(it){ if (selected[it.id]) n++; });
      }
      btns[i].classList.toggle('is-current', i === currentStep);
      /* Shading: unseen = white (no class), seen = light green (is-visited),
         picked in = dark green (has-picks, wins over is-visited) */
      btns[i].classList.toggle('has-picks', n > 0);
      btns[i].classList.toggle('is-visited', !!visited[i]);
      btns[i].setAttribute('aria-current', i === currentStep ? 'step' : 'false');
      cnt.hidden = n === 0;
      cnt.textContent = n;
    }
  }

  /* ---------- Sections — split up, one category at a time ---------- */
  CATEGORIES.forEach(function(cat, ci){
    var sec = document.createElement('section');
    sec.className = 'step' + (ci === 0 ? ' active' : ''); sec.id = 'step-' + ci;
    var html = '<h2>' + cat.heading + '</h2>' + (cat.sub ? '<p class="sub">' + cat.sub + '</p>' : '') + '<div class="items">';
    cat.items.forEach(function(it){
      html += '<div class="p-item" data-pitem="' + it.id + '">'
        + '<div class="p-head"><b>' + it.name + '</b>'
        + (cat.protein ? '<span class="cooked">Cooked · Warm</span>' : '')
        + '</div>'
        + '<div class="lb-row" role="group" aria-label="' + it.name + ' — amount">';
      it.opts.forEach(function(o){
        html += '<button type="button" class="lb" data-lb-item="' + it.id + '" data-amt="' + o.f + '" aria-pressed="false">' + o.b + '</button>';
      });
      html += '</div></div>';
    });
    html += '</div>';
    var nextLabel = ci === CATEGORIES.length - 1 ? 'Next: Checkout →' : 'Next →';
    /* Back is on EVERY step for a consistent layout. On the first step there is
       nowhere to go back to, so it shows disabled — still visible on the page. */
    var backBtn = ci === 0
      ? '<button type="button" class="btn btn-ghost" data-back disabled aria-disabled="true" title="You are on the first step">← Back</button>'
      : '<button type="button" class="btn btn-ghost" data-back>← Back</button>';
    html += '<div class="step-foot">'
      + backBtn
      + '<button type="button" class="btn btn-primary" data-next>' + nextLabel + '</button></div>'
      + '<button type="button" class="btn btn-skip" data-skip>Skip to checkout →</button>';
    sec.innerHTML = html;
    stepsEl.appendChild(sec);
  });

  var reviewSec = document.createElement('section');
  reviewSec.className = 'step checkout-step'; reviewSec.id = 'step-' + CATEGORIES.length;
  reviewSec.innerHTML =
      '<h2>Review &amp; add your name</h2>'
    + '<p class="sub">Check your picks, fix anything, then confirm. You don\'t need something from every category.</p>'
    + '<div class="field-wrap"><label class="field" for="name-input">Your name</label>'
    + '<input type="text" id="name-input" autocomplete="name" placeholder="e.g. Sam Rivera" />'
    + '<p class="error" id="name-error">Add your name so everyone knows who to thank.</p></div>'
    + '<div class="field-wrap"><label class="field" for="email-input">Email</label>'
    + '<input type="email" id="email-input" autocomplete="email" inputmode="email" placeholder="e.g. sam@example.com" />'
    + '<p class="error" id="email-error">Add a valid email so we can reach you if plans change.</p></div>'
    + '<div id="review-body"></div>'
    + '<div class="field-wrap"><label class="field" for="note-input">Note <span style="font-weight:400;color:var(--ink-soft)">(optional)</span></label>'
    + '<textarea id="note-input" rows="2" placeholder="e.g. I can grab extra limes too if needed"></textarea></div>'
    + '<div class="step-foot"><button type="button" class="btn btn-ghost" data-back>← Back</button><button type="button" class="btn btn-primary" id="confirm-btn">Confirm signup</button></div>';
  stepsEl.appendChild(reviewSec);

  function selectedIds(){ return Object.keys(selected).filter(function(id){ return selected[id]; }); }

  function amountNote(cat, id){
    return selected[id] + (cat.protein ? ' · cooked &amp; warm' : '');
  }

  function refresh(){
    var cards = stepsEl.querySelectorAll('.p-item');
    for (var i = 0; i < cards.length; i++){
      var id = cards[i].getAttribute('data-pitem');
      cards[i].classList.toggle('on', !!selected[id]);
      var lbs = cards[i].querySelectorAll('.lb');
      for (var j = 0; j < lbs.length; j++){
        lbs[j].setAttribute('aria-pressed', selected[id] === lbs[j].getAttribute('data-amt') ? 'true' : 'false');
      }
    }
    var n = selectedIds().length;
    badge.hidden = n === 0;
    badge.textContent = n;
    document.getElementById('cart-btn').setAttribute('aria-label',
      n ? 'View your picks, ' + n + (n === 1 ? ' item' : ' items') : 'View your picks');
    updateNav();
    renderSheet();
    renderReview();
  }

  function renderSheet(){
    var ids = selectedIds();
    var body = document.getElementById('sheet-body');
    var count = document.getElementById('sheet-count');
    var go = document.getElementById('sheet-review');
    if (!ids.length){
      count.textContent = 'Nothing picked yet.';
      body.innerHTML = '<p class="sheet-empty">Tap an amount as you go and your picks will stack up here.</p>';
      go.disabled = true;
      return;
    }
    count.textContent = ids.length + (ids.length === 1 ? ' item' : ' items') + ' picked';
    go.disabled = false;
    var html = '';
    CATEGORIES.forEach(function(cat){
      var mine = cat.items.filter(function(it){ return selected[it.id]; });
      if (!mine.length) return;
      html += '<div class="sheet-group"><h3>' + cat.title + '</h3><ul>';
      mine.forEach(function(it){
        html += '<li><span>' + it.name + '<span class="bq">Bringing: ' + amountNote(cat, it.id) + '</span></span>'
          + '<button type="button" data-remove="' + it.id + '" aria-label="Remove ' + it.name + '">×</button></li>';
      });
      html += '</ul></div>';
    });
    body.innerHTML = html;
    bindRemoves(body);
  }

  function bindRemoves(root){
    var rm = root.querySelectorAll('[data-remove]');
    for (var i = 0; i < rm.length; i++){
      rm[i].addEventListener('click', function(){
        delete selected[this.getAttribute('data-remove')];
        refresh();
      });
    }
  }

  function renderReview(){
    var body = document.getElementById('review-body');
    var ids = selectedIds();
    if (!ids.length){
      body.innerHTML = '<p class="empty-note">You haven\'t picked anything yet — go back and choose an amount for what you can bring.</p>';
      return;
    }
    var html = '';
    CATEGORIES.forEach(function(cat, ci){
      var mine = cat.items.filter(function(it){ return selected[it.id]; });
      if (!mine.length) return;
      html += '<div class="review-group"><h3>' + cat.title + '</h3><div class="review-list">';
      mine.forEach(function(it){
        html += '<span class="chip">' + it.name + ' <span class="cq">· ' + amountNote(cat, it.id) + '</span>'
          + '<button type="button" data-remove="' + it.id + '" aria-label="Remove ' + it.name + '">×</button></span>';
      });
      html += '<button type="button" class="edit-link" data-goto="' + ci + '">Edit ' + cat.title.toLowerCase() + '</button>';
      html += '</div></div>';
    });
    body.innerHTML = html;
    bindRemoves(body);
    var ed = body.querySelectorAll('[data-goto]');
    for (var j = 0; j < ed.length; j++){
      ed[j].addEventListener('click', function(){ showStep(parseInt(this.getAttribute('data-goto'), 10)); });
    }
  }

  function openSheet(){ sheet.classList.add('open'); backdrop.classList.add('open'); }
  function closeSheet(){ sheet.classList.remove('open'); backdrop.classList.remove('open'); }
  document.getElementById('cart-btn').addEventListener('click', openSheet);
  document.getElementById('sheet-close').addEventListener('click', closeSheet);
  backdrop.addEventListener('click', closeSheet);
  document.getElementById('sheet-review').addEventListener('click', function(){ closeSheet(); showStep(CATEGORIES.length); });

  stepsEl.addEventListener('click', function(e){
    if (e.target.closest('[data-next]')){ showStep(currentStep + 1); return; }
    var backEl = e.target.closest('[data-back]');
    if (backEl){
      if (backEl.disabled) return; /* first step: Back is shown but disabled */
      showStep(currentStep - 1); return;
    }
    if (e.target.closest('[data-skip]')){ showStep(CATEGORIES.length); return; }
    var lbBtn = e.target.closest('.lb');
    if (lbBtn){
      /* Picking an amount NEVER moves to the next page — not even when every
         item on this step is picked. The page stays put until the person
         taps Next (or Skip to checkout) themselves. */
      var lid = lbBtn.getAttribute('data-lb-item');
      var amt = lbBtn.getAttribute('data-amt');
      if (selected[lid] === amt) delete selected[lid]; else selected[lid] = amt;
      refresh();
      return;
    }
  });

  document.getElementById('confirm-btn').addEventListener('click', function(){
    var nameInput = document.getElementById('name-input');
    var emailInput = document.getElementById('email-input');
    var err = document.getElementById('name-error');
    var emailErr = document.getElementById('email-error');
    var name = nameInput.value.trim();
    var email = emailInput.value.trim();
    if (!selectedIds().length){
      err.textContent = 'Pick at least one item first — go back and tap an amount.';
      err.classList.add('show'); nameInput.classList.add('invalid'); nameInput.focus();
      return;
    }
    if (!name){
      err.textContent = 'Add your name so everyone knows who to thank.';
      err.classList.add('show'); nameInput.classList.add('invalid'); nameInput.focus();
      return;
    }
    err.classList.remove('show'); nameInput.classList.remove('invalid');
    if (!email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){
      emailErr.textContent = email ? 'That email doesn\'t look right — check it and try again.' : 'Add your email so we can reach you if plans change.';
      emailErr.classList.add('show'); emailInput.classList.add('invalid'); emailInput.focus();
      return;
    }
    emailErr.classList.remove('show'); emailInput.classList.remove('invalid');

    var mine = selectedIds();
    var html = '';
    CATEGORIES.forEach(function(cat){
      cat.items.forEach(function(it){
        if (mine.indexOf(it.id) === -1) return;
        html += '<li>' + it.name + ' <span class="dq">— ' + amountNote(cat, it.id) + '</span></li>';
      });
    });
    var note = document.getElementById('note-input').value.trim();
    if (note) html += '<li style="list-style:none;margin-left:-20px;color:var(--ink-soft);font-style:italic">“' + note.replace(/</g,'&lt;') + '”</li>';
    document.getElementById('done-list').innerHTML = html;
    document.getElementById('done-title').textContent = 'You\'re on the list, ' + name.split(' ')[0].replace(/</g,'&lt;') + '!';

    selected = {};
    nameInput.value = ''; emailInput.value = ''; document.getElementById('note-input').value = '';
    closeSheet();
    document.getElementById('flow').style.display = 'none';
    document.getElementById('done').classList.add('show');
    refresh();
    screenEl.scrollTo({top: document.getElementById('flow-wrap').offsetTop - 8, behavior:'smooth'});
  });

  document.getElementById('name-input').addEventListener('input', function(){
    this.classList.remove('invalid');
    document.getElementById('name-error').classList.remove('show');
  });

  document.getElementById('email-input').addEventListener('input', function(){
    this.classList.remove('invalid');
    document.getElementById('email-error').classList.remove('show');
  });

  document.getElementById('again-btn').addEventListener('click', function(){
    document.getElementById('done').classList.remove('show');
    document.getElementById('flow').style.display = '';
    visited = {}; visited[0] = true;
    refresh();
    showStep(0);
  });

  /* ---------- Scroll behavior: shrink the cart, flag the topic bar once it's stuck ---------- */
  var cartBtn = document.getElementById('cart-btn');
  var ticking = false;
  function onScroll(){
    if (ticking) return;
    ticking = true;
    requestAnimationFrame(function(){
      ticking = false;
      /* Shrink the cart once you're scrolling through the steps */
      cartBtn.classList.toggle('shrunk', screenEl.scrollTop > 60);
      /* The topic bar is "stuck" once it reaches its sticky offset below the cart and cutout */
      var stuckAt = 50;
      var navTop = navEl.getBoundingClientRect().top;
      var screenTop = screenEl.getBoundingClientRect().top;
      navEl.classList.toggle('is-stuck', navTop <= screenTop + stuckAt + 1);
    });
  }
  screenEl.addEventListener('scroll', onScroll, {passive:true});
  onScroll();

  refresh();
  showStep(0, true);
})();
</script>
</body>
</html>
